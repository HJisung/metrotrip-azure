# MetroTrip Kubernetes manifest를 한 번에 렌더링하고 적용한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - media-pvc.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - cluster-issuer.yaml
  - ingress.yaml

# 배포 환경의 레지스트리와 불변 태그로 덮어쓴다.
images:
  - name: metrotrip-backend
    newName: registry.example.com/metrotrip-backend
    newTag: latest
  - name: metrotrip-frontend
    newName: registry.example.com/metrotrip-frontend
    newTag: latest
